name: Auto-tag main for release

# Tags every commit that lands on main once CI has actually passed for it, then explicitly
# dispatches release.yml for that tag — release.yml does the real work (npm publish to GitHub
# Packages, the versioned GHCR image) on any "v*.*.*" tag push, so this just gets one created and
# acted on automatically instead of requiring `npm version patch && git push --follow-tags` by
# hand after every merge.
#
# Reacting to CI's own completion (workflow_run), rather than to the raw push, means a merge that
# breaks the build never gets tagged — and therefore never gets published — in the first place.
#
# `branches: [main]` below is NOT enough on its own to mean "a commit that landed on main": a
# workflow_run filter matches the triggering run's head *branch name*, and a pull request from a
# fork's own `main` branch reports exactly that name. Without the job-level guard, such a PR passing
# CI would get its (unreviewed) head commit tagged here and published by release.yml with
# packages: write. Hence the explicit checks on the event type and the head repository.
# This also means nothing here re-runs the test suite: release.yml's own "verify" job does that
# again independently before it lets anything publish, so a tag alone is never enough by itself.
#
# The explicit dispatch step below is not optional flourish: GitHub deliberately does not let an
# event caused by the default GITHUB_TOKEN (this job's own `git push` of the tag) trigger another
# workflow — the anti-recursion guard described in GitHub's own docs on the GITHUB_TOKEN. Without
# it, the tag lands (`git tag`/`git push` above still runs and succeeds) but release.yml never
# starts, silently. `gh workflow run --ref <tag>` is a direct API call, not an implicit push
# event, so it is not subject to that guard — and dispatching against the tag name gives that run
# `github.ref_type == 'tag'` exactly as a real tag push would, so release.yml needs no changes to
# treat it identically.

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  # Serializes tag creation across overlapping runs; matters if two merges land close together,
  # since both would otherwise compute "the next version" from the same starting point.
  group: auto-tag-main
  cancel-in-progress: false

permissions:
  contents: write
  # Needed for the `gh workflow run` dispatch step below — GITHUB_TOKEN otherwise has no
  # permission to start another workflow run via the API.
  actions: write

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute and push the next version tag
        id: tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet

          # Already tagged (a human pushed `npm version …` with --follow-tags, or this run is a
          # re-run): nothing to publish twice.
          existing="$(git tag --points-at "$HEAD_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          if [ -n "$existing" ]; then
            echo "$HEAD_SHA is already tagged $existing; nothing to do."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The next version comes from the highest release tag, not from package.json: nothing
          # bumps package.json on a routine merge (release.yml rewrites it only inside the publish
          # job), so deriving from it alone recomputes an already-taken version on every merge
          # after the first one.
          latest="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -n1)"
          latest="${latest:-0.0.0}"
          pkg="$(node -p "require('./package.json').version")"
          highest="$(printf '%s\n%s\n' "$latest" "$pkg" | sort -V | tail -n1)"
          if [ "$pkg" != "$latest" ] && [ "$pkg" = "$highest" ]; then
            # package.json is ahead of every tag, e.g. someone ran `npm version minor` before
            # merging: publish exactly that version rather than bumping past it.
            new_version="v${pkg}"
          else
            IFS='.' read -r major minor patch <<< "$latest"
            new_version="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Tagging $HEAD_SHA as ${new_version} (latest tag v${latest}, package.json ${pkg})"
          git tag "$new_version" "$HEAD_SHA"
          git push origin "$new_version"
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      - name: Dispatch release.yml for the new tag
        if: steps.tag.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: gh workflow run release.yml --ref "$VERSION" -f dry_run=false
