name: Docker image

# Continuous image builds. Feature branches and pull requests build the image without pushing it,
# so a broken Dockerfile is caught before it reaches main; pushes to main publish the moving
# `edge`/`main` tags. Released, versioned images (and `latest`) come from release.yml instead.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build${{ github.ref == 'refs/heads/main' && ' and push' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=wing-mcp-server
            org.opencontainers.image.description=MCP server and web dashboard for the Behringer WING digital mixing console

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only here: this build runs on every push, and emulated arm64 costs far more than
          # it is worth for a moving tag. release.yml builds both architectures.
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # mode=min caches only the final image's layers (production node_modules, dist, ...), not
          # the builder stage and its dev dependencies, whose export took longer than the build
          # itself. ignore-error: the cache only speeds the build up, so a GitHub cache outage (a 504
          # halfway through the export) is logged as a warning instead of failing the build.
          cache-to: type=gha,mode=min,ignore-error=true
          provenance: false
