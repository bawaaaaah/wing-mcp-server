name: Docker image

# Continuous image builds. Pull requests build the image without pushing it, so a broken Dockerfile
# is caught in review; pushes to main publish the moving `edge`/`main` tags. Released, versioned
# images (and `latest`) come from release.yml instead.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build${{ github.event_name == 'pull_request' && '' || ' and push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=wing-mcp-server
            org.opencontainers.image.description=MCP server and web dashboard for the Behringer WING digital mixing console

      - uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 only here: this build runs on every push, and emulated arm64 costs far more than
          # it is worth for a moving tag. release.yml builds both architectures.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
