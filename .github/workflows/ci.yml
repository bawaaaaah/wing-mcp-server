name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  # Called by release.yml so a tagged release runs the exact same checks before anything is
  # published, without duplicating them here.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in engines; 24 is what the Docker image runs on.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # The lint toolchain is a separate install with its own lockfile (see tools/eslint).
          cache-dependency-path: |
            package-lock.json
            tools/eslint/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Once is enough: nothing it checks depends on the Node version. Installs tools/eslint on
        # first use, then runs the type-aware rules against the whole repository.
        if: matrix.node == '22'
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the published tarball
        # Runs once, and after the build: --ignore-scripts skips the prepack rebuild (dist/ is
        # already there from the step above) and keeps the build log out of the --json output.
        if: matrix.node == '22'
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node -e '
            const [pkg] = require("./pack.json");
            const files = new Set(pkg.files.map((f) => f.path));
            const required = ["dist/index.js", "dist/cli.js", "web/dist/index.html", ".env.sample"];
            const missing = required.filter((f) => !files.has(f));
            if (missing.length) {
              console.error("::error::missing from the npm tarball: " + missing.join(", "));
              process.exit(1);
            }
            console.log(`${pkg.name}@${pkg.version}: ${pkg.entryCount} files, ${(pkg.unpackedSize / 1024).toFixed(0)} KiB unpacked`);
          '

      - name: Smoke-test the CLI
        if: matrix.node == '22'
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

      - name: Smoke-test the CLI over stdio
        # The only step that exercises the built dist/cli.js's stdio transport rather than the
        # source under tsx, so this is what would actually catch a build- or packaging-only
        # regression in it. Runs from $RUNNER_TEMP, not the checkout, so it can never pick up a
        # ./.env (cli.ts auto-loads one if present) and connect the smoke test to a real console.
        if: matrix.node == '22'
        working-directory: ${{ runner.temp }}
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci-smoke","version":"0"}}}' \
            > stdio-smoke-input.jsonl
          MCP_CONFIG_PATH="${{ runner.temp }}/stdio-smoke-config.json" \
            node "${{ github.workspace }}/dist/cli.js" --stdio --no-http \
            < stdio-smoke-input.jsonl > stdio-smoke-output.jsonl
          node -e '
            const fs = require("fs");
            const firstLine = fs.readFileSync("stdio-smoke-output.jsonl", "utf8").split("\n")[0];
            const response = JSON.parse(firstLine);
            if (response.result?.serverInfo?.name !== "wing-mcp-server") {
              console.error("::error::unexpected stdio response: " + firstLine);
              process.exit(1);
            }
            console.log("stdio transport answered initialize as " + response.result.serverInfo.name);
          '
