# Builds the image from this checkout. To run the image published to GHCR instead of building it,
# see the ready-made compose file in docs/install-docker.md.
services:
  wing-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8787}:8787"
      # The console *pushes* meter frames to this port, so the host side and the container side
      # have to match — otherwise changing WING_METER_UDP_PORT silently stops the meters.
      - "${WING_METER_UDP_PORT:-14135}:${WING_METER_UDP_PORT:-14135}/udp"
    environment:
      # Keeps the container's listen port in step with the published one above.
      PORT: 8787
      WING_METER_UDP_PORT: "${WING_METER_UDP_PORT:-14135}"
    env_file:
      # Optional: everything has a default, and the console's address can just as well be set from
      # the dashboard's Wing > Config tab on first run.
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8787/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - wing-mcp

networks:
  wing-mcp:
    driver: bridge
