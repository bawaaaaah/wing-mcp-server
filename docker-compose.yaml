# Builds the image from this checkout and runs it in one of two network modes. To run the image
# published to GHCR instead of building it, see docs/install-docker.md.
#
#   docker compose --profile nat  up -d --build    # port mapping, works everywhere
#   docker compose --profile host up -d --build    # host network, Linux only
#
# A profile is mandatory: both services carry one, so a bare `docker compose up` selects nothing
# and exits silently. Put COMPOSE_PROFILES=nat (or host) in .env to make the bare command work.
#
# Every socket this server opens, and why only two of them are published in nat mode:
#
#   flow                  socket                                      direction   published?
#   --------------------  ------------------------------------------  ----------  ----------
#   dashboard/API/mcp     binds tcp 8787                              inbound     YES
#   metering stream       binds udp 14135                             console→us  YES
#   metering subscribe    connects to console tcp 2222                outbound    no
#   OSC control           sends to console udp 2223, ephemeral source  outbound    no
#   console discovery     broadcasts to 255.255.255.255 udp 2222       outbound    no
#   OSC mirror (opt-in)   sends to the mirror target                   outbound    no
#
# The outbound ones need nothing published: the console answers on the source port of the request
# it received (docs/wing-protocol/02-osc-protocol.md — the `/%<port>/` redirect that would change
# that is not used here), so the NAT mapping the outgoing packet created carries the reply back.
# That mapping never has time to expire either: the OSC client renews its subscription every 4s and
# heartbeats every 7s, both well inside the 30s conntrack UDP timeout.
#
# What nat mode still costs you, in short — docs/install-docker.md has the full list:
#   - console discovery cannot work at all (a broadcast does not leave the bridge),
#   - the console sees the Docker host's address, not the container's,
#   - the metering port is announced to the console by number, so both sides of that mapping must
#     be the same number — which is why they share one variable below.

x-wing-mcp-server: &wing-mcp-server
  build:
    context: .
    dockerfile: Dockerfile
  # Same name in both modes, so `docker logs wing-mcp` works whichever profile is up. The two
  # services are mutually exclusive, so they can never collide over it.
  container_name: wing-mcp
  env_file:
    # Optional: everything has a default, and the console's address can just as well be set from
    # the dashboard's Wing > Config tab on first run.
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
  # No healthcheck here on purpose: the image ships one that reads PORT from the environment, so it
  # follows whichever mode is active instead of being hardcoded to one of them.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  # ---- nat: published ports on a user-defined bridge. Portable, isolated, no discovery. ----
  wing-mcp-server:
    <<: *wing-mcp-server
    profiles: [nat]
    ports:
      - "${PORT:-8787}:8787"
      - "${WING_METER_UDP_PORT:-14135}:${WING_METER_UDP_PORT:-14135}/udp"
    environment:
      # The container always listens on 8787 here; PORT above is only the host side of the mapping.
      PORT: 8787
      WING_METER_UDP_PORT: "${WING_METER_UDP_PORT:-14135}"

  # ---- host: the host's own network stack. Linux only, no isolation, discovery works. ----
  wing-mcp-server-host:
    <<: *wing-mcp-server
    profiles: [host]
    network_mode: host
    environment:
      # No mapping to hide behind: PORT is the port the dashboard actually listens on.
      PORT: "${PORT:-8787}"
      WING_METER_UDP_PORT: "${WING_METER_UDP_PORT:-14135}"
