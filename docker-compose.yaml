# Builds the image from this checkout. To run the image published to GHCR instead of building it,
# see the ready-made compose file in docs/install-docker.md.
#
# Every socket this server opens, and why only two of them are published:
#
#   flow                  socket                                      direction   published?
#   --------------------  ------------------------------------------  ----------  ----------
#   dashboard/API/mcp     binds tcp 8787                              inbound     YES
#   metering stream       binds udp 14135                             console→us  YES
#   metering subscribe    connects to console tcp 2222                outbound    no
#   OSC control           sends to console udp 2223, ephemeral source  outbound    no
#   console discovery     broadcasts to 255.255.255.255 udp 2222       outbound    no
#   OSC mirror (opt-in)   sends to the mirror target                   outbound    no
#
# The outbound ones need nothing published: the console answers on the source port of the request
# it received (docs/wing-protocol/02-osc-protocol.md — the `/%<port>/` redirect that would change
# that is not used here), so the NAT mapping the outgoing packet created carries the reply back.
# That mapping never has time to expire either: the OSC client renews its subscription every 4s and
# heartbeats every 7s, both well inside the 30s conntrack UDP timeout.
#
# Two consequences worth knowing:
#   - Discovery cannot work on a bridge network at all. A broadcast does not leave it, whatever is
#     published. Use network_mode: host, or set the console's IP by hand.
#   - The metering port is announced to the console *by number*, over the TCP subscription, so the
#     host side and the container side must be the same number. That is why both sides below use
#     the same variable.
services:
  wing-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8787}:8787"
      - "${WING_METER_UDP_PORT:-14135}:${WING_METER_UDP_PORT:-14135}/udp"
    environment:
      # Keeps the container's listen port in step with the published one above.
      PORT: 8787
      WING_METER_UDP_PORT: "${WING_METER_UDP_PORT:-14135}"
    env_file:
      # Optional: everything has a default, and the console's address can just as well be set from
      # the dashboard's Wing > Config tab on first run.
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8787/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - wing-mcp

networks:
  wing-mcp:
    driver: bridge
